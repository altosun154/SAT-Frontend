<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAT Prep – Verify Your Identity</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <div class="auth-page">

    <div class="auth-logo"><img src="logo.webp" alt="Logo" style="height:54px;display:block;margin:0 auto 10px;"> SAT<span>Prep</span></div>

    <div class="auth-card">
      <h1 class="auth-heading">Enter your code</h1>
      <p class="auth-subheading">Open your authenticator app and enter the 6-digit code</p>

      <div class="auth-error-banner" id="errorBanner" role="alert"></div>

      <form id="verify2faForm" novalidate>

        <div class="form-group">
          <label for="code">Authentication code</label>
          <input
            type="text"
            id="code"
            name="code"
            placeholder="123456"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
            required
          />
          <p class="field-error" id="codeError">Please enter the 6-digit code.</p>
        </div>

        <button type="submit" class="auth-submit" id="submitBtn">Verify</button>

      </form>

      <p class="auth-switch">
        <a href="login.html" id="backToLogin">Back to sign in</a>
      </p>
    </div>

  </div>

  <script src="js/accessibility.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/verify-2fa.js"></script>

</body>
</html>
