<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAT Prep – Sign In</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <div class="auth-page">

    <div class="auth-logo"><img src="logo.webp" alt="Logo" style="height:54px;display:block;margin:0 auto 10px;"> SAT<span>Prep</span></div>

    <div class="auth-card">
      <h1 class="auth-heading">Welcome back</h1>
      <p class="auth-subheading">Sign in to continue your prep</p>

      <div class="auth-error-banner" id="errorBanner" role="alert"></div>

      <form id="loginForm" novalidate>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />
          <p class="field-error" id="emailError">Please enter a valid email address.</p>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
          <p class="field-error" id="passwordError">Password is required.</p>
        </div>

        <button type="submit" class="auth-submit" id="submitBtn">Sign In</button>

      </form>

      <p class="auth-switch">
        Don't have an account? <a href="signup.html">Sign up</a>
      </p>
    </div>

  </div>

  <script src="js/accessibility.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>

</body>
</html>
