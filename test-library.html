<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAT Prep – Practice Test Library</title>
  <link rel="stylesheet" href="css/reset.css?v=2026-03-15" />
  <link rel="stylesheet" href="css/style.css?v=2026-03-15" />
  <link rel="stylesheet" href="css/index.css?v=2026-03-15" />
  <script src="js/auth.js"></script>
</head>
<body>
<script>requireAuth();</script>

  <nav class="navbar">
    <div class="logo"><img src="logo.webp" alt="Logo" style="height:36px;width:auto;display:block;flex-shrink:0;"> SAT<span>Prep</span></div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="test-library.html" class="active">Practice Tests</a></li>
      <li><a href="results.html">Results</a></li>
      <li><a href="topic-questions.html">Topic Questions</a></li>
      <li><a href="account.html">Account</a></li>
      <li id="adminNavLink" class="hidden"><a href="admin.html">Admin Dashboard</a></li>
    </ul>
    <script>if (sessionStorage.getItem('userRole') === 'admin') document.getElementById('adminNavLink').classList.remove('hidden');</script>
    <div class="notif-wrap" id="notifWrap">
      <button class="notif-bell" id="notifBell" aria-label="Notifications">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span class="notif-badge hidden" id="notifBadge"></span>
      </button>
      <div class="notif-pane hidden" id="notifPane">
        <div class="notif-pane-head">
          <span class="notif-pane-title">Notifications</span>
          <button class="notif-mark-all" id="notifMarkAll">Mark all read</button>
        </div>
        <div class="notif-prefs">
          <label class="notif-pref-label"><input type="checkbox" id="prefQuizReminders" /><span>Quiz Reminders</span></label>
          <label class="notif-pref-label"><input type="checkbox" id="prefWeeklyReports" /><span>Weekly Reports</span></label>
        </div>
        <ul class="notif-list" id="notifList">
          <li class="notif-empty">You're all caught up!</li>
        </ul>
      </div>
    </div>
    <button class="btn-signout" onclick="logout()">Sign Out</button>
  </nav>

  <div class="page-container">
    <section class="home-section">
      <div class="section-header">
        <h2>Practice Test Library</h2>
      </div>
      <p style="color:#777;margin:-4px 0 16px">Full-length, timed practice tests your instructor has unlocked for you.</p>
      <div id="libraryList">
        <div class="assigned-empty"><p>Loading tests…</p></div>
      </div>
    </section>
  </div>

  <script src="js/accessibility.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/test-library.js"></script>
</body>
</html>
