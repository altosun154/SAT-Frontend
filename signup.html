<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAT Prep – Create Account</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <div class="auth-page">

    <div class="auth-logo"><img src="logo.webp" alt="Logo" style="height:54px;display:block;margin:0 auto 10px;"> SAT<span>Prep</span></div>

    <div class="auth-card">
      <h1 class="auth-heading">Create your account</h1>
      <p class="auth-subheading">Start your SAT prep journey today</p>

      <div class="auth-error-banner" id="errorBanner" role="alert"></div>

      <form id="signupForm" novalidate>

        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input
            type="text"
            id="fullName"
            name="fullName"
            placeholder="Your full name"
            autocomplete="name"
            required
          />
          <p class="field-error" id="fullNameError">Please enter your full name.</p>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />
          <p class="field-error" id="emailError">Please enter a valid email address.</p>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            autocomplete="new-password"
            required
          />
          <div class="password-strength" id="passwordStrength">
            <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
            <span class="strength-label" id="strengthLabel"></span>
          </div>
          <p class="field-error" id="passwordError">Password must be at least 8 characters.</p>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Re-enter your password"
            autocomplete="new-password"
            required
          />
          <p class="field-error" id="confirmPasswordError">Passwords do not match.</p>
        </div>

        <button type="submit" class="auth-submit" id="submitBtn">Create Account</button>

      </form>

      <p class="auth-switch">
        Already have an account? <a href="login.html">Sign in</a>
      </p>
    </div>

  </div>

  <script src="js/accessibility.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/signup.js"></script>

</body>
</html>
